[package]
name = "sito"
description = "Sito desktop app: thin Tauri layer over sito-core."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "sito_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
sito-core = { path = "../crates/core" }
tauri = { version = "2.12.5", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["rustls-tls", "system-proxy"] }
tauri-plugin-opener = "2"
# The system language, the default of the UI language.
sys-locale = "0.3.2"
# Embedded WebDriver server for the end-to-end tests on Windows and macOS (feature `e2e`).
# It serves automation over HTTP, so it is never in a shipped build.
tauri-plugin-wdio-webdriver = { version = "=1.5.1", optional = true }

[features]
# Builds the app under test of the real-app e2e suite (`e2e-app/`).
e2e = ["dep:tauri-plugin-wdio-webdriver"]

[lints]
workspace = true

[dev-dependencies]
chrono = "0.4.45"
tempfile = "3"
trash = "5.2.9"
