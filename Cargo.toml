[workspace]
resolver = "3"
members = ["crates/core", "src-tauri"]

[workspace.package]
version = "0.13.0"
edition = "2024"
rust-version = "1.90"
repository = "https://github.com/lukaszkalnik/sito"
license = "MIT OR Apache-2.0"
publish = false

[workspace.lints.rust]
# `deny`, not `forbid`, so a vetted FFI call can carry an `expect` with its reason.
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
wildcard_enum_match_arm = "warn"

# Unoptimized image decoding is many times slower, which made debug builds
# (used for testing during a slice) render thumbnails far slower than the
# release. Optimize just the image-related dependencies in dev builds.
[profile.dev.package.image]
opt-level = 3

[profile.dev.package.jpeg-decoder]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.dev.package.zune-core]
opt-level = 3

[profile.dev.package.blake3]
opt-level = 3

[profile.dev.package.nom-exif]
opt-level = 3

# The JPEG decoder is generic over its reader, so its decoding code is
# compiled inside sito-core: without this a thumbnail took 2.3 s instead of
# 0.2 s in debug builds (measured 2026-10-29).
[profile.dev.package.sito-core]
opt-level = 3
