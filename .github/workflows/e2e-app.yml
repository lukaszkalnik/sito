name: E2E (real app)

# Drives the built app, not a mock: windows, plugins, threads, the file system
# and restarts (slice 28, e2e-app/). The mocked Playwright suite in ui/e2e
# stays the fast test of the UI flows.
on:
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-app-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (Xvfb, tauri-driver)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The smoke test's folders (data, config, cache, trash, debug log) live
      # under the job's temp folder, never in the runner's home; the specs
      # get folders of their own.
      - name: Put the app's state in the temp folder
        run: |
          {
            echo "XDG_DATA_HOME=$RUNNER_TEMP/sito-state/data"
            echo "XDG_CONFIG_HOME=$RUNNER_TEMP/sito-state/config"
            echo "XDG_CACHE_HOME=$RUNNER_TEMP/sito-state/cache"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Tauri build dependencies and WebKitWebDriver
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev librsvg2-dev libxdo-dev libssl-dev \
            build-essential xvfb webkitgtk-webdriver
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: tauri-driver@2.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build the app under test
        run: npm run e2e:app:build -- -- --locked
      - name: Smoke test (open the viewer, close both windows)
        run: |
          xvfb-run -a e2e-app/smoke-test.sh target/debug/sito \
            "$XDG_CONFIG_HOME/io.github.lukaszkalnik.sito.e2e/.window-state.json"
      - name: Run the e2e specs
        run: xvfb-run -a npm run e2e:app
      - name: Keep the results (screenshots, app state, logs)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-app-linux
          path: |
            e2e-app/results
            ${{ runner.temp }}/sito-state
          if-no-files-found: ignore

  windows:
    name: Windows (embedded WebDriver)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # With the embedded WebDriver (feature e2e): the Edge WebDriver could not
      # attach to the app's WebView2 („DevToolsActivePort file doesn't exist”).
      - name: Build the app under test
        run: npm run e2e:app:build:embedded -- -- --locked
      - name: Run the e2e specs
        run: npm run e2e:app
      - name: Keep the results (screenshots, app state, logs)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-app-windows
          path: e2e-app/results
          if-no-files-found: ignore

  macos:
    name: macOS (embedded WebDriver)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # With the embedded WebDriver (feature e2e), as Apple has none for WKWebView.
      - name: Build the app under test
        run: npm run e2e:app:build:embedded -- -- --locked
      - name: Smoke test (open the viewer, close both windows)
        run: |
          e2e-app/smoke-test.sh target/debug/sito \
            "$HOME/Library/Application Support/io.github.lukaszkalnik.sito.e2e/.window-state.json"
      - name: Run the e2e specs
        run: npm run e2e:app
      - name: Keep the results (screenshots, app state, logs)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-app-macos
          path: e2e-app/results
          if-no-files-found: ignore
