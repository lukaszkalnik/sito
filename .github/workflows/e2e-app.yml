name: E2E (real app)

# Drives the built app, not a mock: windows, plugins, threads, the file system
# and restarts (slice 28). The mocked Playwright suite in ui/e2e stays the
# fast test of the UI flows.
on:
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-app-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (Xvfb)
    runs-on: ubuntu-latest
    steps:
      # The app's own folders (data, config, cache, trash, debug log) live
      # under the job's temp folder, never in the runner's home.
      - name: Put the app's state in the temp folder
        run: |
          {
            echo "XDG_DATA_HOME=$RUNNER_TEMP/sito-state/data"
            echo "XDG_CONFIG_HOME=$RUNNER_TEMP/sito-state/config"
            echo "XDG_CACHE_HOME=$RUNNER_TEMP/sito-state/cache"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Tauri build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev librsvg2-dev libxdo-dev libssl-dev \
            build-essential xvfb webkit2gtk-driver
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build the app under test
        run: npm run tauri -- build --debug --no-bundle -- --locked
      # SITO_SMOKE_TEST=1 opens the viewer like a click on a photo, closes both
      # windows and exits with 0 (src-tauri/src/smoke.rs). A freeze while
      # opening a window (v0.6.2) shows up as the timeout.
      - name: Smoke test (open the viewer, close both windows)
        run: |
          set +e
          SITO_SMOKE_TEST=1 timeout 60 xvfb-run -a target/debug/sito
          code=$?
          case $code in
            0) echo 'Smoke test passed' ;;
            2) echo '::error::Viewer window could not be opened' ;;
            3) echo '::error::Viewer window was opened but not shown' ;;
            124) echo '::error::App froze while opening or closing the viewer (no exit within 60 s)' ;;
            *) echo "::error::App failed with exit code $code" ;;
          esac
          if [ "$code" -ne 0 ]; then exit "$code"; fi
          state="$XDG_CONFIG_HOME/io.github.lukaszkalnik.sito/.window-state.json"
          for label in main viewer; do
            if ! jq -e --arg l "$label" 'has($l)' "$state" > /dev/null; then
              echo "::error::Window state in $state has no '$label' window"
              exit 1
            fi
          done
      - name: Keep the app's state and debug log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-app-linux
          path: ${{ runner.temp }}/sito-state
          if-no-files-found: ignore
