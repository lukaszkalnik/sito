name: Release

# Tag `vX.Y.Z` → build, smoke-test and publish a release.
# Manual run (workflow_dispatch) → same build and smoke test; installers are
# uploaded as workflow artifacts instead of a release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.os }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ''
            # The installer and its update signature (`.sig`).
            bundles: target/release/bundle/nsis/*-setup.exe*
          - os: macos-latest
            args: '--target universal-apple-darwin'
            bundles: target/universal-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    env:
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches the Cargo.toml version
        if: env.IS_TAG == 'true'
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

      # Fails before the long build if the tag has no changelog section.
      - name: Check that CHANGELOG.md has a section for the tag
        if: env.IS_TAG == 'true'
        shell: bash
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > /dev/null

      # Without the real public key every update would fail its signature
      # check, so a release built before the key is in place is refused.
      - name: Check that the updater has its public key
        shell: bash
        run: |
          if grep -q 'REPLACE_WITH_THE_CONTENTS' src-tauri/tauri.conf.json; then
            echo "::error::plugins.updater.pubkey in src-tauri/tauri.conf.json is a placeholder (see docs/RELEASING.md, Update signing key)"
            exit 1
          fi

      # The notes the app shows with the update (`latest.json`).
      - name: Read the changes of the tag for the update manifest
        id: notes
        if: env.IS_TAG == 'true'
        shell: bash
        run: |
          {
            echo 'body<<SITO_NOTES_END'
            node scripts/release-notes.mjs "$GITHUB_REF_NAME" --changes-only
            echo 'SITO_NOTES_END'
          } >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # macOS signing and notarization come later (slice 23). The updater
      # signing key signs the update bundles and their `latest.json` entries.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.IS_TAG == 'true' && github.ref_name || '' }}
          releaseName: 'Sito ${{ github.ref_name }}'
          # The changes alone, which also become the notes in `latest.json`;
          # the release page gets the full notes when it is published.
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          args: ${{ matrix.args }}

      - name: Smoke-test the installer (install, launch, open the viewer, uninstall)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $installer = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $installer) { throw 'No NSIS installer found' }
          Write-Host "Installing $($installer.Name)"
          Start-Process $installer.FullName -ArgumentList '/S' -Wait

          $dir = Join-Path $env:LOCALAPPDATA 'Sito'
          $exe = Get-ChildItem $dir -Filter *.exe -ErrorAction SilentlyContinue |
            Where-Object Name -NotMatch '^uninstall' | Select-Object -First 1
          if (-not $exe) {
            Get-ChildItem $env:LOCALAPPDATA | Format-Table Name
            throw "App executable not found in $dir"
          }

          # SITO_SMOKE_TEST=1 starts the app as usual, opens the viewer like a
          # click on a photo, then closes both windows and exits with 0
          # (src-tauri/src/smoke.rs). A crash shows up as an exit code, a freeze
          # while opening a window (v0.6.2) as a timeout.
          $stateFile = Join-Path $env:APPDATA 'io.github.lukaszkalnik.sito\.window-state.json'
          Remove-Item $stateFile -ErrorAction SilentlyContinue
          Write-Host "Launching $($exe.FullName) and opening the viewer"
          $env:SITO_SMOKE_TEST = '1'
          $app = Start-Process $exe.FullName -PassThru
          $env:SITO_SMOKE_TEST = $null
          $null = $app.Handle  # without it, ExitCode stays empty after the exit
          if (-not $app.WaitForExit(60000)) {
            Stop-Process -Id $app.Id -Force
            throw 'App froze while opening or closing the viewer (no exit within 60 s)'
          }
          switch ($app.ExitCode) {
            0 { }
            2 { throw 'Viewer window could not be opened' }
            3 { throw 'Viewer window was opened but not shown' }
            default { throw "App failed with exit code $($app.ExitCode)" }
          }
          if (-not (Test-Path $stateFile)) { throw "Window state not saved to $stateFile" }
          $state = Get-Content $stateFile -Raw | ConvertFrom-Json
          foreach ($label in 'main', 'viewer') {
            if (-not $state.$label) { throw "Window state has no '$label' window" }
          }

          Write-Host 'Uninstalling'
          Start-Process (Join-Path $dir 'uninstall.exe') -ArgumentList '/S' -Wait
          # The NSIS uninstaller re-launches itself from a temp copy; wait for it.
          for ($i = 0; $i -lt 30 -and (Test-Path $exe.FullName); $i++) { Start-Sleep -Seconds 2 }
          if (Test-Path $exe.FullName) { throw 'App still installed after uninstall' }
          Write-Host 'Smoke test passed'

      - name: Upload installers (manual runs)
        if: env.IS_TAG != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sito-${{ matrix.os }}
          path: ${{ matrix.bundles }}
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # The updater reads `latest.json` of the newest published release; a
      # broken one stays in the draft instead of reaching installed apps.
      - name: Check the update manifest
        run: |
          gh release download "$GITHUB_REF_NAME" --pattern latest.json --dir manifest --repo "$GITHUB_REPOSITORY"
          node scripts/check-update-manifest.mjs manifest/latest.json "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish with the CHANGELOG.md section as release notes
        run: |
          node scripts/release-notes.mjs "$GITHUB_REF_NAME" > notes.md
          gh release edit "$GITHUB_REF_NAME" --notes-file notes.md --draft=false --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
