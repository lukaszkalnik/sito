name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # tauri::generate_context! needs the built frontend.
      - run: npm ci
      - run: npm run build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  frontend:
    name: Frontend (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck -w ui
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
        working-directory: ui
      - run: npm run e2e

  licenses:
    name: Third-party licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Pinned, so the generated notices match the ones made locally.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.3
      # Fails on a license that is not in about.toml.
      - run: cargo fetch --locked
      - run: npm run notices:rust
      - name: Check that the committed Rust notices are up to date
        run: |
          if ! git diff --exit-code ui/notices/; then
            echo "::error::ui/notices/rust-crates.txt is out of date; run 'npm run notices:rust' and commit it"
            exit 1
          fi
